name: Android Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed release APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.NJUPTER_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NJUPTER_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "PR build has no secrets access; skipping signing (falls back to debug)."
              exit 0
            fi
            echo "Missing NJUPTER_RELEASE_KEYSTORE_B64; refusing to build an unsigned main release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > njupter-release.jks
          {
            echo "storeFile=njupter-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=njupter"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          chmod 600 njupter-release.jks keystore.properties

      - name: Build signed release APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease --console=plain

      - name: Verify signature
        if: github.event_name != 'pull_request'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-arm64-v8a-release.apk

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release
    needs: build-release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: dist

      - name: Create GitHub release with APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NJUPTer build ${GITHUB_RUN_NUMBER}" \
            --generate-notes \
            dist/*.apk
